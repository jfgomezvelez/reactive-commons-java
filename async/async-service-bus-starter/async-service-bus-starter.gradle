ext {
    artifactId = 'async-service-bus-starter'
    artifactDescription = 'Async Service Bus Starter'
}

dependencies {
    api project(':async-service-bus')

    compileOnly 'org.springframework.boot:spring-boot-starter'

    implementation 'com.azure:azure-core:1.27.0'
    implementation 'com.azure:azure-messaging-servicebus:7.8.0'
    implementation 'com.azure.resourcemanager:azure-resourcemanager:2.14.0'
    implementation group: 'com.microsoft.azure', name: 'azure-servicebus', version: '3.6.6'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'io.projectreactor:reactor-test'
}
